#:schema node_modules/wrangler/config-schema.json
name = "accelera-hub"
main = ".open-next/worker.js"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "accelera-hub"

[observability]
enabled = true

# Jadwal Cron Produksi (UTC):
# 1) "0 0 */3 * *"  -> Tiap 3 hari (/api/cron/keep-alive anti-pause Supabase Free Tier)
# 2) "30 1 * * 1-5" -> Senin-Jumat pukul 08.30 WIB / 01.30 UTC (/api/cron/sla-reminder)
[triggers]
crons = ["0 0 */3 * *", "30 1 * * 1-5"]
